<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WILLTECH Code Academy — Experience the Future</title>
<style>
  :root{
    --navy:#050b24;--electric:#2f7bff;--cyan:#22d3ee;--purple:#8b5cf6;
    --ink:#e8eefc;--muted:#94a3b8;--glass:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--navy);color:var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%,rgba(47,123,255,.18),transparent 45%),
      radial-gradient(circle at 85% 20%,rgba(139,92,246,.15),transparent 45%),
      radial-gradient(circle at 50% 90%,rgba(34,211,238,.10),transparent 45%);
    background-attachment:fixed;min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  .container{max-width:1200px;margin:0 auto;padding:0 20px}
  .glass{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:16px}
  header{position:sticky;top:0;z-index:50;background:rgba(5,11,36,.85);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
  .brand .bolt{font-size:22px}
  .brand .cy{color:var(--cyan)}
  .nav-links{display:flex;gap:22px;font-size:14px;align-items:center}
  .nav-links a{cursor:pointer}
  .nav-links a:hover{color:var(--cyan)}
  .nav-mobile-btn{display:none;font-size:24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;
    transition:transform .15s,box-shadow .2s;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(90deg,var(--electric),var(--purple));
    color:#fff;box-shadow:0 0 30px rgba(47,123,255,.35)}
  .btn-primary:hover{box-shadow:0 0 45px rgba(47,123,255,.55);transform:translateY(-1px)}
  .btn-ghost{border:1px solid rgba(34,211,238,.4);color:var(--cyan)}
  .btn-ghost:hover{background:rgba(34,211,238,.1)}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
  .btn-block{width:100%}
  .card{padding:24px;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-2px)}
  .card-glow:hover{box-shadow:0 0 40px rgba(34,211,238,.25)}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;
    background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted)}
  .pill.premium{background:rgba(139,92,246,.2);color:#d8b4fe;border-color:rgba(139,92,246,.4)}
  .pill.free{background:rgba(34,211,238,.15);color:#a5f3fc;border-color:rgba(34,211,238,.35)}
  .hero{padding:80px 0 60px;text-align:center}
  .hero h1{font-size:clamp(34px,6vw,64px);font-weight:700;line-height:1.1;margin-bottom:18px}
  .grad{background:linear-gradient(90deg,var(--cyan),var(--electric),var(--purple));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--muted);max-width:620px;margin:0 auto 32px;font-size:17px;line-height:1.6}
  .badge{margin-bottom:24px}
  section{padding:60px 0}
  h2{font-size:clamp(24px,4vw,36px);font-weight:700;margin-bottom:24px}
  .input{width:100%;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04);
    border:1px solid var(--border);color:var(--ink);font-size:14px;outline:none;transition:border .2s}
  .input:focus{border-color:var(--cyan)}
  .input::placeholder{color:#64748b}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-bg.open{display:flex}
  .modal{width:100%;max-width:420px;padding:28px;background:#0a1330;
    border:1px solid var(--border);border-radius:18px}
  .code-editor{width:100%;height:280px;padding:14px;border-radius:12px;
    background:#020617;border:1px solid var(--border);color:#a5f3fc;
    font-family:'Courier New',monospace;font-size:13px;line-height:1.5;
    resize:vertical;outline:none}
  .code-editor:focus{border-color:var(--cyan)}
  .output{background:#020617;border:1px solid var(--border);border-radius:12px;
    padding:14px;color:#4ade80;font-family:'Courier New',monospace;font-size:13px;
    height:280px;overflow:auto;white-space:pre-wrap;word-wrap:break-word}
  .output .err{color:#f87171}.output .muted{color:#475569}
  .chat-window{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:14px;padding:16px;height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:12px 14px;border-radius:14px;font-size:14px;
    line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:rgba(47,123,255,.3)}
  .msg.assistant{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));
    transition:width .4s}
  .lesson-layout{display:grid;grid-template-columns:260px 1fr;gap:20px}
  @media(max-width:768px){.lesson-layout{grid-template-columns:1fr}}
  .lesson-list button{width:100%;text-align:left;padding:10px 12px;border-radius:8px;
    font-size:13px;margin-bottom:4px;transition:background .15s}
  .lesson-list button:hover{background:rgba(255,255,255,.05)}
  .lesson-list button.active{background:rgba(34,211,238,.18);color:var(--cyan);font-weight:600}
  .toast{position:fixed;bottom:24px;right:24px;padding:14px 20px;border-radius:12px;
    background:#0a1330;border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,.5);
    z-index:200;transform:translateY(200%);transition:transform .3s;font-size:14px;max-width:340px}
  .toast.show{transform:translateY(0)}
  .toast.success{border-color:rgba(74,222,128,.4);color:#86efac}
  .toast.error{border-color:rgba(248,113,113,.4);color:#fca5a5}
  .muted{color:var(--muted);font-size:14px;line-height:1.6}
  .text-center{text-align:center}
  .mt-2{margin-top:8px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
  .mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  footer{border-top:1px solid var(--border);padding:40px 0;text-align:center;margin-top:40px;
    color:var(--muted);font-size:14px}
  @media(max-width:768px){
    .nav-links{display:none}
    .nav-mobile-btn{display:block}
    .nav-links.open{display:flex;position:absolute;top:64px;left:0;right:0;
      flex-direction:column;background:#0a1330;padding:16px 20px;gap:16px;
      border-bottom:1px solid var(--border);align-items:flex-start}
    .hero{padding:50px 0 40px}
    section{padding:40px 0}
  }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="brand" data-nav="home">
      <span class="bolt">⚡</span>
      <span>WILLTECH <span class="cy">Code Academy</span></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a data-nav="courses">Courses</a>
      <a data-nav="playground">Playground</a>
      <a data-nav="ai">AI Tutor</a>
      <a data-nav="dashboard">Dashboard</a>
      <span id="navAuth"></span>
    </nav>
    <button class="nav-mobile-btn" id="mobileBtn">☰</button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="container">
    <p style="margin-bottom:8px">
      WILLTECH CODE ACADEMY — <span class="cy" style="color:var(--cyan)">EXPERIENCE THE FUTURE</span>
    </p>
    <p>hello@willtechacademy.com · Lagos, Nigeria</p>
    <p style="margin-top:12px;font-size:12px">
      © <span id="year"></span> WILLTECH · Demo ·
      <a data-nav="verify" style="color:var(--cyan);cursor:pointer">Verify Certificate</a>
    </p>
  </div>
</footer>

<div class="modal-bg" id="authModal">
  <div class="modal">
    <div class="flex-between mb-4">
      <h3 id="authTitle" style="font-size:22px">Sign In</h3>
      <button id="authClose" style="font-size:22px;color:var(--muted)">×</button>
    </div>
    <div id="authBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg, type){
    type = type || "success";
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast " + type + " show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2800);
  }

  /* ---------- Storage ---------- */
  var Store = {
    get: function(k, def){
      try { var v = localStorage.getItem("wt_" + k);
            return v === null ? def : JSON.parse(v); }
      catch(e){ return def; }
    },
    set: function(k, v){
      try { localStorage.setItem("wt_" + k, JSON.stringify(v)); } catch(e){}
    },
    del: function(k){
      try { localStorage.removeItem("wt_" + k); } catch(e){}
    }
  };

  /* ---------- Courses ---------- */
  var COURSES = [
    { id:"python", icon:"🐍", title:"Python", level:"beginner", premium:false,
      desc:"Master Python from syntax to real programs — variables, loops, functions, OOP.",
      lessons:[
        { chapter:"Getting Started", title:"Hello, World!",
          content:'Your first Python program:\n\n    print("Hello, World!")\n\nThe print() function displays text to the screen.',
          exercise:"Print your own name." },
        { chapter:"Getting Started", title:"Variables and Types",
          content:'    name = "Ada"\n    print(name)\n\nPython is dynamically typed.\n- int = whole numbers\n- float = decimals\n- str = text\n- bool = True/False',
          exercise:"Create variables for your age, name, and favourite number, then print them." },
        { chapter:"Control Flow", title:"If / Elif / Else",
          content:'    age = 20\n    if age >= 18:\n        print("Adult")\n    elif age >= 13:\n        print("Teen")\n    else:\n        print("Child")',
          exercise:"Classify a number as positive, negative, or zero." },
        { chapter:"Control Flow", title:"Loops",
          content:'    for i in range(5):\n        print(i)\n\n    n = 3\n    while n > 0:\n        print(n)\n        n -= 1',
          exercise:"Print the first 10 even numbers using a for loop." },
        { chapter:"Functions", title:"Defining Functions",
          content:'    def greet(name):\n        return "Hello, " + name + "!"\n\n    print(greet("Ada"))\n\nFunctions keep your code reusable.',
          exercise:"Write a function square(n) that returns n squared." }
      ],
      quiz:[
        { q:"What does print('hi') do?",
          options:["Writes to a file","Outputs 'hi' to the console","Deletes 'hi'","Raises an error"],
          answer:1, explanation:"print() outputs its argument to stdout." },
        { q:"Which keyword defines a function in Python?",
          options:["func","def","function","lambda"],
          answer:1, explanation:"Python uses the def keyword." },
        { q:"What's 2 + 3 * 2?",
          options:["10","8","12","6"],
          answer:1, explanation:"Multiplication before addition: 3*2=6, then 2+6=8." }
      ]
    },
    { id:"javascript", icon:"⚡", title:"JavaScript", level:"beginner", premium:false,
      desc:"The language of the web. Learn DOM, events, async, fetch, and modern ES2023.",
      lessons:[
        { chapter:"Basics", title:"Hello, JS",
          content:'    console.log("Hello, World!");',
          exercise:"Print your name to the console." },
        { chapter:"Basics", title:"Variables",
          content:'    let name = "Ada";\n    const age = 25;\n\nUse const by default, let when you need to reassign.',
          exercise:"Create variables for name, age and country." },
        { chapter:"Functions", title:"Arrow Functions",
          content:'    const add = (a, b) => a + b;\n    console.log(add(2, 3));',
          exercise:"Write an arrow function that squares a number." }
      ],
      quiz:[
        { q:"Which declares a constant in JS?",
          options:["var","let","const","static"],
          answer:2, explanation:"const declares a block-scoped constant." },
        { q:"What does console.log() do?",
          options:["Prints to console","Alerts user","Saves to file","Nothing"],
          answer:0, explanation:"It logs to the developer console." }
      ]
    },
    { id:"html-css", icon:"🎨", title:"HTML & CSS", level:"beginner", premium:false,
      desc:"Build beautiful, semantic, responsive pages from scratch.",
      lessons:[
        { chapter:"HTML", title:"Your First Page",
          content:'<h1>Hello!</h1>\n<p>This is a paragraph.</p>',
          exercise:"Build a page with a heading and a paragraph." },
        { chapter:"CSS", title:"Styling Basics",
          content:'    body {\n      background: #050b24;\n      color: white;\n      font-family: sans-serif;\n    }',
          exercise:"Center a heading on the page using flexbox." }
      ],
      quiz:[
        { q:"Which tag creates a heading?",
          options:["<h1>","<head>","<title>","<p>"],
          answer:0, explanation:"<h1> is a top-level heading." },
        { q:"Which CSS property sets text color?",
          options:["background","color","font","fill"],
          answer:1, explanation:"color sets text color." }
      ]
    },
    { id:"sql", icon:"🗄️", title:"SQL", level:"beginner", premium:false,
      desc:"Query, model, and manipulate relational data with confidence.",
      lessons:[
        { chapter:"Queries", title:"SELECT",
          content:'    SELECT * FROM users;\n    SELECT name, age FROM users WHERE age >= 18;',
          exercise:"Write a query that selects users older than 20." }
      ],
      quiz:[
        { q:"What does SELECT do?",
          options:["Deletes rows","Reads data","Updates rows","Creates tables"],
          answer:1, explanation:"SELECT reads data from tables." }
      ]
    },
    { id:"java", icon:"☕", title:"Java", level:"intermediate", premium:true,
      desc:"Object-oriented programming, collections, and enterprise patterns.",
      lessons:[
        { chapter:"Basics", title:"Hello, Java",
          content:'    public class Main {\n      public static void main(String[] a) {\n        System.out.println("Hello!");\n      }\n    }',
          exercise:"Print your name." }
      ],
      quiz:[
        { q:"Which method is the entry point?",
          options:["start()","main()","run()","init()"],
          answer:1, explanation:"main is the entry point." }
      ]
    },
    { id:"c++", icon:"⚙️", title:"C++", level:"advanced", premium:true,
      desc:"Systems programming, memory, performance, and algorithms.", lessons:[], quiz:[] },
    { id:"php", icon:"🐘", title:"PHP", level:"intermediate", premium:true,
      desc:"Server-side scripting, MVC, and building real APIs.", lessons:[], quiz:[] },
    { id:"typescript", icon:"🟦", title:"TypeScript", level:"intermediate", premium:true,
      desc:"Type-safe JavaScript for large applications.", lessons:[], quiz:[] },
    { id:"csharp", icon:"🎯", title:"C#", level:"intermediate", premium:true,
      desc:"Build .NET applications and modern backend services.", lessons:[], quiz:[] },
    { id:"go", icon:"🚀", title:"Go", level:"intermediate", premium:true,
      desc:"Fast, concurrent, cloud-native backends.", lessons:[], quiz:[] },
    { id:"rust", icon:"🦀", title:"Rust", level:"advanced", premium:true,
      desc:"Memory-safe systems programming with zero-cost abstractions.", lessons:[], quiz:[] },
    { id:"ruby", icon:"💎", title:"Ruby", level:"beginner", premium:true,
      desc:"Elegant scripting with Rails for web apps.", lessons:[], quiz:[] },
    { id:"swift", icon:"🍎", title:"Swift", level:"intermediate", premium:true,
      desc:"Build iOS and macOS apps with SwiftUI.", lessons:[], quiz:[] }
  ];

  /* ---------- App state ---------- */
  var S = {
    user: Store.get("user", null),
    page: "home",
    course: null,
    lessonIdx: 0,
    quizAnswers: [],
    quizResult: null,
    chat: [],
    lang: "python"
  };

  /* ---------- Escape ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- Progress ---------- */
  function progress(courseId){
    return Store.get("progress_" + courseId, { done: [] });
  }

  /* ============================================================
     RENDERERS
     ============================================================ */

  function renderHome(){
    var features = [
      ["🎯","13 Languages","Python, JS, C++, Rust, Swift, Go, SQL and more."],
      ["🤖","AI Tutor","Get line-by-line explanations in your level."],
      ["🧪","Code Playground","Write & run code right in your browser."],
      ["🏆","Certificates","Earn verifiable PDF certificates."]
    ];
    var featured = COURSES.slice(0, 4);
    return ''
      + '<section class="hero"><div class="container">'
      +   '<span class="pill badge">⚡ Powered by WILLTECH AI</span>'
      +   '<h1>Learn Today.<br><span class="grad">Build Tomorrow.</span></h1>'
      +   '<p>A futuristic programming academy that takes you from beginner to confident developer — with AI tutoring, real code execution, quizzes and certificates.</p>'
      +   '<div class="row" style="justify-content:center">'
      +     '<button class="btn btn-primary" data-nav="courses">Explore Courses</button>'
      +     '<button class="btn btn-ghost" id="homeSignup">Create Free Account</button>'
      +   '</div>'
      + '</div></section>'
      + '<section><div class="container grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'
      +   features.map(function(f){
            return '<div class="glass card">'
              + '<div style="font-size:32px;margin-bottom:12px">' + f[0] + '</div>'
              + '<h3 style="font-size:18px;margin-bottom:8px">' + f[1] + '</h3>'
              + '<p class="muted" style="font-size:13px">' + f[2] + '</p>'
              + '</div>';
          }).join("")
      + '</div></section>'
      + '<section><div class="container"><h2>Featured Courses</h2>'
      +   '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'
      +     featured.map(function(c){
              return '<button class="glass card card-glow" style="text-align:left" data-course="' + c.id + '">'
                + '<div style="font-size:36px;margin-bottom:10px">' + c.icon + '</div>'
                + '<h3 style="font-size:20px">' + c.title + '</h3>'
                + '<p class="muted mt-2" style="font-size:13px">' + esc(c.desc) + '</p>'
                + '<div class="row mt-4" style="gap:6px">'
                +   '<span class="pill">' + c.level + '</span>'
                +   (c.premium ? '<span class="pill premium">Premium</span>' : '<span class="pill free">Free</span>')
                + '</div></button>';
            }).join("")
      +   '</div></div></section>'
      + '<section><div class="container"><div class="glass card" style="padding:32px">'
      +   '<h2 style="font-size:26px;margin-bottom:12px">Meet <span style="color:var(--cyan)">WILLTECH AI Tutor</span></h2>'
      +   '<p class="muted" style="max-width:600px">Stuck on a bug? Paste your code and ask for a line-by-line walkthrough. The tutor adapts to your level.</p>'
      +   '<button class="btn btn-primary mt-6" data-nav="ai">Try the AI Tutor</button>'
      + '</div></div></section>'
      + '<section><div class="container" style="max-width:800px"><h2>FAQ</h2>'
      +   [
            ["Is it really free?","Yes — beginner courses are free forever. Premium unlocks intermediate/advanced content."],
            ["Do I get certificates?","Yes, after you complete every lesson in a course and pass the quiz."],
            ["Can I code on mobile?","Absolutely. The playground is mobile-optimised."]
          ].map(function(faq){
            return '<details class="glass" style="padding:14px 18px;margin-bottom:10px">'
              + '<summary style="cursor:pointer;font-weight:600"><span style="color:var(--cyan)">▸</span> ' + faq[0] + '</summary>'
              + '<p class="muted mt-2" style="font-size:13px">' + faq[1] + '</p>'
              + '</details>';
          }).join("")
      + '</div></section>';
  }

  function renderCourses(){
    return ''
      + '<section><div class="container">'
      + '<h1 class="mb-4" style="font-size:36px">All Courses</h1>'
      + '<p class="muted mb-6">Choose a language and start learning today.</p>'
      + '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'
      +   COURSES.map(function(c){
            return '<button class="glass card card-glow" style="text-align:left" data-course="' + c.id + '">'
              + '<div style="font-size:40px;margin-bottom:12px">' + c.icon + '</div>'
              + '<h3 style="font-size:20px">' + c.title + '</h3>'
              + '<p class="muted mt-2" style="font-size:13px">' + esc(c.desc) + '</p>'
              + '<div class="row mt-4" style="gap:6px">'
              +   '<span class="pill">' + c.level + '</span>'
              +   (c.premium ? '<span class="pill premium">Premium</span>' : '<span class="pill free">Free</span>')
              +   '<span class="pill">' + c.lessons.length + ' lessons</span>'
              + '</div></button>';
          }).join("")
      + '</div></div></section>';
  }

  function renderCourse(){
    var c = S.course;
    if (!c) return '<section><div class="container"><p>Course not found.</p></div></section>';

    if (c.lessons.length === 0){
      return ''
        + '<section><div class="container">'
        + '<button class="btn btn-ghost btn-sm mb-6" data-nav="courses">← Back</button>'
        + '<div class="glass card text-center" style="padding:40px">'
        + '<div style="font-size:60px">' + c.icon + '</div>'
        + '<h1 class="mt-4" style="font-size:32px">' + c.title + '</h1>'
        + '<p class="muted mt-2">Content for this course is coming soon. Explore Python, JavaScript, HTML/CSS or SQL for now.</p>'
        + '</div></div></section>';
    }

    var lesson = c.lessons[S.lessonIdx];
    var prog = S.user ? progress(c.id) : { done: [] };
    var pct = Math.round((prog.done.length / c.lessons.length) * 100);
    var isDone = prog.done.indexOf(S.lessonIdx) !== -1;

    var lessonButtons = c.lessons.map(function(l, i){
      var done = prog.done.indexOf(i) !== -1;

  function showPage(name){
    S.page = name;
    document.getElementById("navLinks").classList.remove("open");
    window.scrollTo({top:0,behavior:"smooth"});
    var html;
    if (name === "home") html = renderHome();
    else if (name === "courses") html = renderCourses();
    else if (name === "course") html = renderCourse();
    else if (name === "playground") html = renderPlayground();
    else if (name === "ai") html = renderAI();
    else if (name === "dashboard") html = renderDashboard();
    else if (name === "premium") html = renderPremium();
    else if (name === "verify") html = renderVerify();
    else html = renderHome();
    document.getElementById("app").innerHTML = html;
    afterRender(name);
  }

  /* ============================================================

  function afterRender(name){
    if (name === "playground") setupPlayground();
    if (name === "ai") setupAI();
    if (name === "verify") {
      var b = document.getElementById("verifyBtn");
      if (b) b.addEventListener("click", doVerify);
      var i = document.getElementById("verifyInput");
      if (i) i.addEventListener("keydown", function(e){ if (e.key==="Enter") doVerify(); });
    }
    if (name === "premium") {
      var u = document.getElementById("upgradeBtn");
      if (u) u.addEventListener("click", upgradeDemo);
    }
    if (name === "course") {
      var mc = document.getElementById("markComplete");
      if (mc) mc.addEventListener("click", markComplete);
      var sq = document.getElementById("submitQuiz");
      if (sq) sq.addEventListener("click", submitQuiz);
      var rq = document.getElementById("retakeQuiz");
      if (rq) rq.addEventListener("click", function(){
        S.quizAnswers = []; S.quizResult = null; showPage("course");
      });
    }
  }

  /* ============================================================
     GLOBAL EVENT DELEGATION
     ============================================================ */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-nav]");
    if (t){ e.preventDefault(); showPage(t.getAttribute("data-nav")); return; }

    var c = e.target.closest("[data-course]");
    if (c){ e.preventDefault(); openCourse(c.getAttribute("data-course")); return; }

    var l = e.target.closest("[data-lesson]");
    if (l){ e.preventDefault(); S.lessonIdx = parseInt(l.getAttribute("data-lesson"),10); showPage("course"); return; }

    var lg = e.target.closest("[data-lang]");
    if (lg){ e.preventDefault(); changeLang(lg.getAttribute("data-lang")); return; }

    var a = e.target.closest("[data-answer]");
    if (a){
      var parts = a.getAttribute("data-answer").split(",");
      setAnswer(parseInt(parts[0],10), parseInt(parts[1],10));
      return;
    }

    var cert = e.target.closest("[data-cert]");
    if (cert){ e.preventDefault(); generateCertificate(cert.getAttribute("data-cert")); return; }

    if (e.target.id === "homeSignup" || e.target.id === "aiSignIn" || e.target.id === "dashSignIn"){
      openAuth(); return;
    }

    if (e.target.id === "mobileBtn"){
      document.getElementById("navLinks").classList.toggle("open");
      return;
    }
  });

  function openCourse(id){
    var c = COURSES.find(function(x){ return x.id === id; });
    if (!c) return;
    if (c.premium && (!S.user || !S.user.premium)){
      toast("Premium course — sign in and upgrade to unlock.", "error");
      showPage("premium");
      return;
    }
    S.course = c;
    S.lessonIdx = 0;
    S.quizAnswers = [];
    S.quizResult = null;
    showPage("course");
  }

  function markComplete(){
    if (!S.user){ openAuth(); return; }
    var c = S.course;
    var p = progress(c.id);
    if (p.done.indexOf(S.lessonIdx) === -1){
      p.done.push(S.lessonIdx);
      Store.set("progress_" + c.id, p);
      toast("Lesson completed!");
      showPage("course");
    }
  }

  function setAnswer(qi, oi){
    S.quizAnswers[qi] = oi;
    showPage("course");
  }

  function submitQuiz(){
    var c = S.course;
    if (S.quizAnswers.length < c.quiz.length || S.quizAnswers.some(function(a){ return a === undefined; })){
      return toast("Answer every question first.", "error");
    }
    var score = 0;
    var feedback = c.quiz.map(function(q, i){
      var correct = S.quizAnswers[i] === q.answer;
      if (correct) score++;
      return { question_index: i, correct: correct, explanation: q.explanation };
    });
    S.quizResult = { score: score, total: c.quiz.length, feedback: feedback };
    if (S.user){
      var att = Store.get("attempts", []);
      att.unshift({ course: c.title, score: score, total: c.quiz.length, date: new Date().toISOString() });
      Store.set("attempts", att.slice(0, 20));
    }
    showPage("course");
  }

  function setupPlayground(){
    var ed = document.getElementById("codeEditor");
    ed.value = DEFAULTS[S.lang] || "";
    updateLangHighlight();
    document.getElementById("runBtn").addEventListener("click", runCode);
    document.getElementById("resetBtn").addEventListener("click", resetCode);
  }

  function updateLangHighlight(){
    var pills = document.querySelectorAll("[data-lang]");
    pills.forEach(function(p){
      var isActive = p.getAttribute("data-lang") === S.lang;
      p.style.background = isActive ? "rgba(34,211,238,.2)" : "";
      p.style.color = isActive ? "var(--cyan)" : "";
    });
  }

  function changeLang(l){
    S.lang = l;
    var ed = document.getElementById("codeEditor");
    if (ed) ed.value = DEFAULTS[l] || "";
    var out = document.getElementById("output");
    if (out) out.innerHTML = '<span class="muted">Output appears here…</span>';
    updateLangHighlight();
  }

  function resetCode(){
    var ed = document.getElementById("codeEditor");
    ed.value = DEFAULTS[S.lang] || "";
    document.getElementById("output").innerHTML = '<span class="muted">Output appears here…</span>';
  }

  function runCode(){
    var code = document.getElementById("codeEditor").value;
    var out = document.getElementById("output");

    if (S.lang === "html"){
      out.innerHTML = '<iframe style="width:100%;height:100%;border:none;background:#fff;border-radius:8px" srcdoc="' + code.replace(/"/g,'&quot;') + '"></iframe>';
      return;
    }

    if (S.lang === "javascript" || S.lang === "typescript"){
      // Run JS safely in an iframe
      var logs = [];
      var iframe = document.createElement("iframe");
      iframe.style.display = "none";
      document.body.appendChild(iframe);
      try {
        var w = iframe.contentWindow;
        w.console = { log: function(){ logs.push(Array.prototype.join.call(arguments, " ")); } };
        w.eval(code);
        out.textContent = logs.length ? logs.join("\n") : "(no output — code ran successfully)";
      } catch (err){
        out.innerHTML = '<span class="err">' + esc(err.message) + '</span>';
      } finally {
        document.body.removeChild(iframe);
      }
      return;
    }

    if (S.lang === "sql"){
      out.innerHTML = '<span class="muted">SQL needs the backend (SQLite via Piston). UI is functional; wire the backend to execute.</span>';
      return;
    }

    out.innerHTML = '<span class="muted">' + esc(S.lang) + ' execution requires the backend (Piston).\nUI is fully functional — wire the backend to enable real runs.\n\nAlternatively, switch to JavaScript to test the runner now.</span>';
  }

  /* ============================================================
     AI TUTOR (DEMO)
     ============================================================ */
  function setupAI(){
    var win = document.getElementById("chatWindow");
    if (!S.chat.length){
      S.chat = [{ role:"assistant", content:"Hi! I'm WILLTECH AI Tutor. Ask me about loops, functions, variables, errors, or exercises." }];
    }
    renderChat();
    var input = document.getElementById("aiInput");
    var send = document.getElementById("sendBtn");
    send.addEventListener("click", sendAI);
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendAI(); }
    });
    input.focus();
  }

  function renderChat(){
    var win = document.getElementById("chatWindow");
    win.innerHTML = S.chat.map(function(m){
      return '<div class="msg ' + m.role + '">' + esc(m.content) + '</div>';
    }).join("");
    win.scrollTop = win.scrollHeight;
  }

  function sendAI(){
    var input = document.getElementById("aiInput");
    var text = input.value.trim();
    if (!text) return;
    S.chat.push({ role:"user", content:text });
    input.value = "";
    renderChat();
    setTimeout(function(){
      var reply = demoReply(text);
      S.chat.push({ role:"assistant", content:reply });
      renderChat();
    }, 400);
  }

  function demoReply(text){
    var t = text.toLowerCase();
    if (/hello|hi|hey/.test(t)){
      return "Hello! 👋 What are you learning today? Try asking:\n• \"Explain Python loops\"\n• \"Give me a JavaScript exercise\"\n• \"Why is my code not working?\"";
    }
    if (/loop/.test(t)){
      return "A loop repeats code. Two common types:\n\n1. for loop — repeat a known number of times:\n   for i in range(5):\n       print(i)\n\n2. while loop — repeat while a condition is true:\n   n = 3\n   while n > 0:\n       print(n)\n       n -= 1\n\nPractice: print the first 10 even numbers.";
    }
    if (/function|def/.test(t)){
      return "A function groups reusable code.\n\nPython:\n   def greet(name):\n       return \"Hello, \" + name + \"!\"\n\nJavaScript:\n   const greet = name => `Hello, ${name}!`;\n\nFunctions help you avoid repeating yourself (DRY).";
    }
    if (/variable/.test(t)){
      return "Variables store values.\n\nPython: name = \"Ada\"\nJavaScript: let age = 25; const country = \"NG\";\n\nUse const by default in JS, let when you need to reassign.";
    }
    if (/error|bug|fix|why.*not work/.test(t)){
      return "Common debugging steps:\n1. Read the error message — the line number is the clue.\n2. Print values before the crash line.\n3. Check for typos, missing quotes, or mismatched brackets.\n4. Paste the error here and I'll walk through it.";
    }
    if (/exercise|practice|challenge/.test(t)){
      return "Try this:\n\nWrite a function that takes a list of numbers and returns the sum of only the even numbers.\n\nExample: [1,2,3,4,5,6] → 12\n\nTest it in the Playground, then paste your solution here.";
    }
    return "Great question! In demo mode I give canned replies. When the backend is configured, this routes to a live AI model.\n\nTry asking about: loops, functions, variables, errors, or exercises.";
  }

  /* ============================================================
     CERTIFICATE
     ============================================================ */
  function generateCertificate(courseId){
    var c = COURSES.find(function(x){ return x.id === courseId; });
    if (!c) return;
    var user = S.user;
    var certNum = "WCA-" + Math.random().toString(36).slice(2, 14).toUpperCase();
    var certs = Store.get("certificates", {});
    certs[certNum] = { name: user.name, course: c.title, issued: new Date().toISOString() };
    Store.set("certificates", certs);

    var win = window.open("", "_blank");
    if (!win){ toast("Popup blocked — allow popups to download.", "error"); return; }
    win.document.write(
      '<html><head><title>Certificate — ' + esc(c.title) + '</title>'
      + '<style>'
      + '@page{size:A4 landscape;margin:0}'
      + 'body{margin:0;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#050b24;color:#e8eefc}'
      + '.cert{width:900px;padding:60px;border:4px solid #22d3ee;border-radius:16px;text-align:center;background:linear-gradient(135deg,#050b24,#0a1330)}'
      + 'h1{color:#22d3ee;font-size:40px;letter-spacing:2px;margin:0 0 8px}'
      + 'h2{font-size:16px;letter-spacing:4px;color:#94a3b8;margin:0 0 40px;font-weight:normal}'
      + '.name{font-size:44px;color:#fff;margin:20px 0;font-weight:bold}'
      + '.body{font-size:18px;color:#cbd5e1;margin:10px 0}'
      + '.course{font-size:32px;color:#2f7bff;margin:20px 0;font-weight:bold}'
      + '.footer{margin-top:50px;font-size:12px;color:#64748b}'
      + '</style></head><body><div class="cert">'
      + '<h1>WILLTECH CODE ACADEMY</h1>'
      + '<h2>EXPERIENCE THE FUTURE</h2>'
      + '<p class="body">Certificate of Completion</p>'
      + '<div class="name">' + esc(user.name) + '</div>'
      + '<p class="body">has successfully completed</p>'
      + '<div class="course">' + esc(c.title) + '</div>'
      + '<p class="footer">Certificate ID: ' + certNum + '<br>Issued: ' + new Date().toLocaleDateString() + '<br>Verify at willtechacademy.com</p>'
      + '</div></body></html>'
    );
    win.document.close();
    toast("Certificate ready — Print → Save as PDF");
  }

  function doVerify(){
    var num = document.getElementById("verifyInput").value.trim().toUpperCase();
    var certs = Store.get("certificates", {});
    var result = document.getElementById("verifyResult");
    if (!num){ result.innerHTML = '<p class="muted">Enter a certificate ID.</p>'; return; }
    if (certs[num]){
      var c = certs[num];
      result.innerHTML = '<div class="glass card" style="border:1px solid rgba(74,222,128,.4)">'
        + '<p style="color:#4ade80;font-weight:bold;margin-bottom:12px">✓ Valid Certificate</p>'
        + '<p><span class="muted">Name:</span> ' + esc(c.name) + '</p>'
        + '<p><span class="muted">Course:</span> ' + esc(c.course) + '</p>'
        + '<p><span class="muted">Issued:</span> ' + new Date(c.issued).toLocaleDateString() + '</p>'
        + '</div>';
    } else {
      result.innerHTML = '<div class="glass card" style="border:1px solid rgba(248,113,113,.4)">'
        + '<p style="color:#f87171">✗ No certificate found with that ID.</p>'
        + '<p class="muted mt-2" style="font-size:13px">Certificates in this demo live only in your browser.</p>'
        + '</div>';
    }
  }

  /* ============================================================
     PREMIUM DEMO
     ============================================================ */
  function upgradeDemo(){
    if (!S.user){ openAuth(); return; }
    S.user.premium = true;
    Store.set("user", S.user);
    toast("✓ Premium activated (demo). Real payments use Paystack.");
    showPage("dashboard");
  }

  /* ============================================================
     AUTH
     ============================================================ */
  var authMode = "login";

  function openAuth(){
    renderAuth();
    document.getElementById("authModal").classList.add("open");
  }
  function closeAuth(){
    document.getElementById("authModal").classList.remove("open");
  }

  function renderAuth(){
    document.getElementById("authTitle").textContent = authMode === "login" ? "Sign In" : "Create Account";
    var body = document.getElementById("authBody");
    if (authMode === "login"){
      body.innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">'
        + '<input class="input" id="authEmail" type="email" placeholder="Email" required>'
        + '<input class="input" id="authPassword" type="password" placeholder="Password" required>'
        + '<button class="btn btn-primary btn-block" id="loginBtn">Sign In</button>'
        + '<p class="text-center muted" style="font-size:13px">No account? '
        + '<a style="color:var(--cyan);cursor:pointer" id="switchToRegister">Create one</a></p>'
        + '</div>';
      document.getElementById("loginBtn").addEventListener("click", doLogin);
      document.getElementById("switchToRegister").addEventListener("click", function(){
        authMode = "register"; renderAuth();
      });
    } else {
      body.innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">'
        + '<input class="input" id="authName" placeholder="Full name" required>'
        + '<input class="input" id="authEmail" type="email" placeholder="Email" required>'
        + '<input class="input" id="authPassword" type="password" placeholder="Password (8+ chars)" required minlength="8">'
        + '<button class="btn btn-primary btn-block" id="registerBtn">Sign Up</button>'
        + '<p class="text-center muted" style="font-size:13px">Already have an account? '
        + '<a style="color:var(--cyan);cursor:pointer" id="switchToLogin">Sign in</a></p>'
        + '</div>';
      document.getElementById("registerBtn").addEventListener("click", doRegister);
      document.getElementById("switchToLogin").addEventListener("click", function(){
        authMode = "login"; renderAuth();
      });
    }
  }

  function updateNavAuth(){
    var el = document.getElementById("navAuth");
    if (S.user){
      el.innerHTML = '<span style="font-size:13px;color:var(--muted);margin-right:8px">Hi, '
        + esc(S.user.name.split(" ")[0]) + '</span>'
        + '<button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>';
      document.getElementById("logoutBtn").addEventListener("click", logout);
    } else {
      el.innerHTML = '<button class="btn btn-primary btn-sm" id="signInBtn">Sign In</button>';
      document.getElementById("signInBtn").addEventListener("click", openAuth);
    }
  }

  function doLogin(){
    var email = document.getElementById("authEmail").value.trim().toLowerCase();
    var pass = document.getElementById("authPassword").value;
    if (!email || !pass){ toast("Fill all fields", "error"); return; }
    var users = Store.get("users", {});
    if (!users[email] || users[email].password !== pass){
      toast("Invalid email or password", "error"); return;
    }
    S.user = { name: users[email].name, email: email, premium: users[email].premium || false };
    Store.set("user", S.user);
    updateNavAuth();
    closeAuth();
    toast("Welcome back, " + S.user.name.split(" ")[0] + "!");
    showPage("dashboard");
  }

  function doRegister(){
    var name = document.getElementById("authName").value.trim();
    var email = document.getElementById("authEmail").value.trim().toLowerCase();
    var pass = document.getElementById("authPassword").value;
    if (!name || !email || !pass){ toast("Fill all fields", "error"); return; }
    if (pass.length < 8){ toast("Password must be 8+ chars", "error"); return; }
    var users = Store.get("users", {});
    if (users[email]){ toast("Email already registered", "error"); return; }
    users[email] = { name: name, password: pass, premium: false };
    Store.set("users", users);
    S.user = { name: name, email: email, premium: false };
    Store.set("user", S.user);
    updateNavAuth();
    closeAuth();
    toast("Account created! 🎉");
    showPage("dashboard");
  }

  function logout(){
    S.user = null;
    Store.del("user");
    updateNavAuth();
    toast("Signed out");
    showPage("home");
  }

  /* ============================================================
     BOOT
     ============================================================ */
  document.getElementById("year").textContent = new Date().getFullYear();
  updateNavAuth();
  showPage("home");

  // Expose for debugging
  window.__willtech = { showPage: showPage, S: S, Store: Store };
})();
</script>
